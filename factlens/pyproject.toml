[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factlens"
version = "0.1.0"
description = "Decodability vs. causality of factual recall in small language models: logit lens, linear probing, and activation patching, all from scratch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FactLens Contributors" }]
keywords = [
    "interpretability",
    "mechanistic-interpretability",
    "language-models",
    "probing",
    "activation-patching",
    "logit-lens",
    "factual-recall",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "ipywidgets>=8.0"]
dev = ["ruff>=0.4", "black>=24.0"]

[project.urls]
Homepage = "https://github.com/<your-github-username>/factlens"

[tool.setuptools.packages.find]
include = ["factlens*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
